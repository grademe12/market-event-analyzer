name: OpenDART live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/opendart-live-smoke
    paths:
      - ".github/workflows/opendart-live-smoke.yml"
      - "scripts/opendart_smoke.py"
      - "src/market_event_analyzer/providers/opendart.py"
      - "src/market_event_analyzer/news.py"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Run OpenDART live smoke test
        run: python scripts/opendart_smoke.py
